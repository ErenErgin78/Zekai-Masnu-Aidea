<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - UMAY</title>
    <meta name="description" content="UMAY Tarım Asistanı - Kayıt Ol">
    <meta name="theme-color" content="#0a1e1a">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Styles - Modüler yapı -->
    <link rel="stylesheet" href="static/css/themes.css">
    <link rel="stylesheet" href="static/css/main.css">
    <link rel="stylesheet" href="static/css/animations.css">
    <link rel="stylesheet" href="static/css/responsive.css">
    <link rel="stylesheet" href="static/css/auth.css">
</head>
<body>
    <!-- Ana kapsayıcı -->
    <div class="auth-container">
        <!-- Tema Butonu -->
        <button id="themeToggle" class="theme-btn-top" title="Tema Değiştir">
            <span class="theme-icon">🎨</span>
        </button>
        
        <!-- UMAY Logo -->
        <img src="static/img/UMAY.png" alt="UMAY" class="auth-logo">
        
        <!-- Register Form -->
        <div class="auth-form glass-card">
            <h2 class="auth-title">Kayıt Ol</h2>
            <p class="auth-subtitle">UMAY Tarım Asistanı'na katılın</p>
            
            <form id="registerForm" class="auth-form-content">
                <div class="form-group">
                    <label for="full_name" class="form-label">Ad Soyad</label>
                    <input 
                        type="text" 
                        id="full_name" 
                        name="full_name" 
                        class="form-input" 
                        placeholder="Adınızı ve soyadınızı girin"
                        required
                        autocomplete="name"
                    >
                </div>
                
                <div class="form-group">
                    <label for="username" class="form-label">Kullanıcı Adı</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        placeholder="Kullanıcı adınızı girin"
                        required
                        autocomplete="username"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Şifre</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="Şifrenizi girin"
                            required
                            autocomplete="new-password"
                            minlength="6"
                        >
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Şifreyi göster/gizle">
                            <i class="fas fa-eye eye-icon"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Şifre Tekrar</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            class="form-input" 
                            placeholder="Şifrenizi tekrar girin"
                            required
                            autocomplete="new-password"
                            minlength="6"
                        >
                        <button type="button" class="password-toggle" id="confirmPasswordToggle" aria-label="Şifreyi göster/gizle">
                            <i class="fas fa-eye eye-icon"></i>
                        </button>
                    </div>
                </div>
                
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                
                <button type="submit" class="auth-btn" id="registerBtn">
                    <span id="registerBtnText">Kayıt Ol</span>
                    <span id="registerBtnLoader" class="btn-loader" style="display: none;">⏳</span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Zaten hesabınız var mı? <a href="login.html" class="auth-link">Giriş Yap</a></p>
            </div>
        </div>
    </div>
    
    <!-- Javascript - Modüler yapı -->
    <script src="static/js/utils.js"></script>
    <script src="static/js/api.js"></script>
    <script src="static/js/auth.js"></script>
</body>
</html>
