<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMAY - Tarım Asistanı</title>
    <meta name="description" content="Yapay zeka destekli tarım asistanı">
    <meta name="theme-color" content="#0a1e1a">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Styles - Modüler yapı -->
    <link rel="stylesheet" href="static/css/themes.css">
    <link rel="stylesheet" href="static/css/main.css">
    <link rel="stylesheet" href="static/css/animations.css">
    <link rel="stylesheet" href="static/css/responsive.css">
</head>
<body>
    <!-- Ana kapsayıcı -->
    <div class="app-container">
        <!-- UMAY Logo -->
        <img src="static/img/UMAY.png" alt="UMAY" class="main-logo">
        
        <!-- Tema Butonu (Sağ Alt Köşe) -->
        <button id="themeToggle" class="theme-btn-top" title="Tema Değiştir">
            <span class="theme-icon">🎨</span>
        </button>
        
        <!-- Üst butonlar (Auth) -->
        <div class="top-buttons">
            <!-- Auth Butonları -->
            <div id="authButtons" class="auth-buttons" style="display: none;">
                <a href="login.html" class="auth-btn-top">Giriş Yap</a>
                <a href="register.html" class="auth-btn-top register-btn">Kayıt Ol</a>
            </div>
            
            <!-- Kullanıcı Bilgileri (Giriş yapıldığında görünür) -->
            <div id="userInfo" class="user-info" style="display: none;">
                <span id="userName" class="user-name"></span>
                <button id="logoutBtn" class="auth-btn-top logout-btn" type="button">
                    <i class="fas fa-sign-out-alt" style="margin-right: 0.5rem;"></i>
                    Çıkış
                </button>
            </div>
        </div>
        
        <!-- Sohbet kenar çubuğu düğmesi -->
        <button id="sidebarToggle" class="sidebar-toggle">
            <span class="sidebar-icon">☰</span>
        </button>
        
        <!-- Sohbet kenar çubuğu -->
        <div class="chat-sidebar" id="chatSidebar">
            <div class="chat-header-sidebar">
                <div class="chat-header-title">
                    <h3>💬 Sohbetler</h3>
                    <button id="closeSidebarBtn" class="close-sidebar-btn" aria-label="Sidebar'ı kapat">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <button id="newChatBtn" class="new-chat-btn">+ Yeni Sohbet</button>
            </div>
            <div class="chat-list" id="chatList">
                <!-- Sohbet listesi burada -->
            </div>
        </div>
        
        <!-- Ana paneller kapsayıcısı -->
        <div class="panels-container">
            <!-- Hava durumu paneli (sol) -->
            <div class="info-panel weather-panel glass-card">
                <div class="panel-header">
                    <h3>🌤️ Hava Durumu</h3>
                </div>
                <div class="panel-content" id="weatherContent">
                    <div class="panel-placeholder">
                        <div class="placeholder-icon">🌤️</div>
                        <p>Hava durumu bilgilerini almak için butona basın</p>
                        <button id="weatherBtn" class="panel-btn">Hava Durumu Al</button>
                    </div>
                </div>
            </div>
            
            <!-- Sohbet alanı (orta) -->
            <div class="chat-container glass-card">
                <!-- Sohbet mesajları -->
                <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <img src="static/img/logo.png" alt="UMAY Logo" class="welcome-logo">
                    <h3>Merhaba! Ben UMAY</h3>
                    <p>Tarım konusunda size yardımcı olabilirim. Sorularınızı sorun!</p>
                        <div class="example-questions" id="exampleQuestions">
                            <button class="example-question-btn" data-question="Hangi sebzeler şu mevsimde ekilir?">Hangi sebzeler şu mevsimde ekilir?</button>
                            <button class="example-question-btn" data-question="Toprağımı nasıl iyileştirebilirim?">Toprağımı nasıl iyileştirebilirim?</button>
                            <button class="example-question-btn" data-question="Sulama için ne kadar su kullanmalıyım?">Sulama için ne kadar su kullanmalıyım?</button>
                            <button class="example-question-btn" data-question="Gübreleme nasıl yapılır?">Gübreleme nasıl yapılır?</button>
                        </div>
                    </div>
                </div>
                
                <!-- Sohbet giriş alanı -->
                <div class="chat-input-container">
                    <div class="chat-input-wrapper">
                        <input type="text" id="messageInput" placeholder="Mesajınızı yazın..." autocomplete="off">
                        <button id="sendButton" class="send-btn">
                            <span class="send-icon">📤</span>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Toprak analizi paneli (sağ) -->
            <div class="info-panel soil-panel glass-card">
                <div class="panel-header">
                    <h3>🌱 Toprak Analizi</h3>
                </div>
                <div class="panel-content" id="soilContent">
                    <div class="panel-placeholder">
                        <div class="placeholder-icon">🌱</div>
                        <p>Toprak analizi bilgilerini almak için butona basın</p>
                        <button id="soilBtn" class="panel-btn">Toprak Analizi Al</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Javascript - Modüler yapı -->
    <script src="static/js/utils.js"></script>
    <script src="static/js/api.js"></script>
    <script src="static/js/charts.js"></script>
    <script src="static/js/main.js"></script>
    <script>
        // Auth kontrolü ve UI güncellemesi
        let logoutHandlerAttached = false;
        
        async function checkAuthStatus() {
            const authButtons = document.getElementById('authButtons');
            const userInfo = document.getElementById('userInfo');
            const userName = document.getElementById('userName');
            const logoutBtn = document.getElementById('logoutBtn');
            
            if (isUserLoggedIn()) {
                try {
                    const user = await getCurrentUser();
                    if (user) {
                        // Kullanıcı bilgilerini göster
                        if (authButtons) authButtons.style.display = 'none';
                        if (userInfo) userInfo.style.display = 'flex';
                        if (userName) userName.textContent = `👤 ${user.username}`;
                        // Panelleri aç
                        unlockPanels();
                    }
                } catch (error) {
                    console.error('Kullanıcı bilgisi alınamadı:', error);
                    // Token geçersiz, giriş yapılmamış gibi göster
                    if (authButtons) authButtons.style.display = 'flex';
                    if (userInfo) userInfo.style.display = 'none';
                    logoutUser(); // Geçersiz token'ı temizle
                    // Panelleri kilitle
                    lockPanels();
                }
            } else {
                // Giriş yapılmamış, login/register butonlarını göster
                if (authButtons) authButtons.style.display = 'flex';
                if (userInfo) userInfo.style.display = 'none';
                // Panelleri kilitle
                lockPanels();
            }
            
            // Çıkış butonu event listener (sadece bir kez ekle)
            if (logoutBtn && !logoutHandlerAttached) {
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    logoutUser();
                    // Ana sayfayı yenile
                    window.location.reload();
                });
                logoutHandlerAttached = true;
            }
        }
        
        // Panelleri kilitle (giriş yapılmamışsa)
        function lockPanels() {
            const weatherPanel = document.querySelector('.weather-panel');
            const soilPanel = document.querySelector('.soil-panel');
            const weatherBtn = document.getElementById('weatherBtn');
            const soilBtn = document.getElementById('soilBtn');
            
            // Panellere kilit overlay'i ekle
            if (weatherPanel && !weatherPanel.querySelector('.panel-lock-overlay')) {
                const weatherOverlay = document.createElement('div');
                weatherOverlay.className = 'panel-lock-overlay';
                weatherOverlay.innerHTML = `
                    <div class="lock-content">
                        <i class="fas fa-lock"></i>
                        <p>Giriş yapın</p>
                        <a href="login.html" class="lock-login-btn">Giriş Yap</a>
                    </div>
                `;
                weatherPanel.appendChild(weatherOverlay);
                weatherPanel.classList.add('locked');
            }
            
            if (soilPanel && !soilPanel.querySelector('.panel-lock-overlay')) {
                const soilOverlay = document.createElement('div');
                soilOverlay.className = 'panel-lock-overlay';
                soilOverlay.innerHTML = `
                    <div class="lock-content">
                        <i class="fas fa-lock"></i>
                        <p>Giriş yapın</p>
                        <a href="login.html" class="lock-login-btn">Giriş Yap</a>
                    </div>
                `;
                soilPanel.appendChild(soilOverlay);
                soilPanel.classList.add('locked');
            }
            
            // Butonları devre dışı bırak
            if (weatherBtn) {
                weatherBtn.disabled = true;
                weatherBtn.style.pointerEvents = 'none';
            }
            if (soilBtn) {
                soilBtn.disabled = true;
                soilBtn.style.pointerEvents = 'none';
            }
        }
        
        // Panelleri aç (giriş yapıldıysa)
        function unlockPanels() {
            const weatherPanel = document.querySelector('.weather-panel');
            const soilPanel = document.querySelector('.soil-panel');
            const weatherBtn = document.getElementById('weatherBtn');
            const soilBtn = document.getElementById('soilBtn');
            
            // Kilit overlay'lerini kaldır
            const weatherOverlay = weatherPanel?.querySelector('.panel-lock-overlay');
            const soilOverlay = soilPanel?.querySelector('.panel-lock-overlay');
            
            if (weatherOverlay) {
                weatherOverlay.remove();
                weatherPanel.classList.remove('locked');
            }
            if (soilOverlay) {
                soilOverlay.remove();
                soilPanel.classList.remove('locked');
            }
            
            // Butonları aktif et
            if (weatherBtn) {
                weatherBtn.disabled = false;
                weatherBtn.style.pointerEvents = 'auto';
            }
            if (soilBtn) {
                soilBtn.disabled = false;
                soilBtn.style.pointerEvents = 'auto';
            }
        }
        
        // Sayfa yüklendiğinde auth durumunu kontrol et
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthStatus();
        });
    </script>
</body>
</html>
